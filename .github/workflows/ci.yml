name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Examples
        shell: bash
        run: |
          for manifest in examples/*/Cargo.toml; do
            cargo check --manifest-path "$manifest"
          done

      - name: Package readiness
        run: |
          cargo package --package nive-ui
          cargo package --package nive-runtime-derive
          cargo package --package nive-runtime \
            --config 'patch.crates-io.nive-runtime-derive.path="crates/nive-runtime-derive"' \
            --config 'patch.crates-io.nive-ui.path="crates/nive-ui"'
          cargo package --package nive \
            --config 'patch.crates-io.nive-runtime-derive.path="crates/nive-runtime-derive"' \
            --config 'patch.crates-io.nive-runtime.path="crates/nive-runtime"' \
            --config 'patch.crates-io.nive-ui.path="crates/nive-ui"'
          cargo package --package nive-cli
        shell: bash

      - name: Build nive-cli
        run: cargo build --release --package nive-cli

      - name: Scaffold smoke basic
        run: bash scripts/scaffold-smoke.sh basic

      - name: Scaffold smoke dashboard
        run: bash scripts/scaffold-smoke.sh dashboard

      - name: GitHub consumer smoke basic
        shell: bash
        run: bash scripts/scaffold-smoke-github.sh basic

      - name: GitHub consumer smoke dashboard
        shell: bash
        run: bash scripts/scaffold-smoke-github.sh dashboard

      - name: Icons check
        run: ../../target/release/nive icons check
        working-directory: crates/nive-ui
