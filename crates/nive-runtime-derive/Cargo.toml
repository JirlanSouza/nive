[package]
name = "nive-runtime-derive"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Proc-macro support for the Nive runtime devtools layer."
repository = "https://github.com/nive-rs/nive"
documentation = "https://docs.rs/nive-runtime-derive"
readme = "README.md"
keywords = ["gui", "desktop", "iced", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[features]
devtools = []

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
