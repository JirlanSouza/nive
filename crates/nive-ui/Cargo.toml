[package]
name = "nive-ui"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Reusable visual design system for Rust/Iced desktop applications."
repository = "https://github.com/JirlanSouza/nive"
documentation = "https://docs.rs/nive-ui"
readme = "README.md"
keywords = ["gui", "desktop", "iced", "design-system"]
categories = ["gui"]

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
bundled-fonts = []

[dependencies]
iced = { workspace = true }
nive-core = { version = "0.1.0-alpha.1", path = "../nive-core" }
unicode-segmentation = { workspace = true }

[dev-dependencies]
iced_graphics = "0.14"
iced_renderer = "0.14"
iced_tiny_skia = "0.14"
# Same version `iced_tiny_skia` renders with, so pixel assertions can share its
# `Pixmap` types.
tiny-skia = "0.11"
