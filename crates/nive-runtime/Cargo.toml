[package]
name = "nive-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Reusable runtime foundation for Rust/Iced desktop applications."
categories = ["gui"]

[features]
default = []
file-picker = ["dep:rfd"]
devtools = ["dep:nive-runtime-derive"]

[dependencies]
iced = { workspace = true }
log = { workspace = true }
nive-runtime-derive = { path = "../nive-runtime-derive", optional = true }
nive-ui = { path = "../nive-ui" }
rfd = { version = "0.16", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
