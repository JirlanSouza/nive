[package]
name = "nive-workbench"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Professional fixed-region workbench shell for Rust/Iced desktop applications."
repository = "https://github.com/JirlanSouza/nive"
documentation = "https://docs.rs/nive-workbench"
readme = "README.md"
keywords = ["gui", "desktop", "iced", "workbench"]
categories = ["gui"]

[lints]
workspace = true

[features]
default = []
runtime = ["dep:nive-runtime"]

[dependencies]
iced = { workspace = true }
nive-ui = { version = "0.1.0-alpha.1", path = "../nive-ui" }
nive-runtime = { version = "0.1.0-alpha.1", path = "../nive-runtime", optional = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
iced_renderer = "0.14"
iced_tiny_skia = "0.14"
serde_json = { workspace = true }
