[package]
name = "nive-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "CLI for scaffolding and icon management in Nive apps."
categories = ["gui", "command-line-utilities"]

[[bin]]
name = "nive"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
include_dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = "3"

[dev-dependencies]
tempfile = { workspace = true }
