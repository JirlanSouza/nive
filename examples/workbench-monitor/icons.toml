[provider.lucide]
version = "0.460.0"
stroke_width = "2"
stroke_linecap = "round"
stroke_linejoin = "round"

[roles]
# Declare only the roles this app overrides; anything omitted resolves to
# the framework default. Discover with `nive icons list --provider lucide`.

[symbols]
Dashboard = "lucide:layout-dashboard"
Dependency = "lucide:network"
Diagnostics = "lucide:stethoscope"
Event = "lucide:zap"
Job = "lucide:play"
Server = "lucide:server"

[custom]
